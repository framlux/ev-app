name: images

# Main BUILDS but does not PUBLISH. Tags do both.
#
# Publishing every main commit produced 129 throwaway image versions in a single
# day, each pinned by nothing and referenced by nothing, and made the deployed
# tag a commit sha that says nothing about what is in it. Releases are tags, the
# way the other repos in this org do it.
#
# Main still builds, though, and that is deliberate rather than leftover: two
# Dockerfile breakages in this repo were invisible to both the test suite and
# the typechecker and only appeared in a real image build. Dropping the build on
# main would defer that discovery to release time, which is the worst moment to
# find it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ev-web
            dockerfile: apps/web/Dockerfile
          - name: ev-ingest
            dockerfile: apps/ingest/Dockerfile
          - name: ev-migrator
            dockerfile: packages/db/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Every matrix leg now has a Dockerfile, so this no longer skips anything.
      # It is kept because the failure it guards against is silent: a leg whose
      # Dockerfile is missing would otherwise either fail red (training people to
      # ignore a red images run, which is exactly when a real regression slips
      # through) or be quietly dropped, leaving a green tick claiming an image was
      # published when none was. Skip, and say so loudly in the job summary.
      - id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭ ${{ matrix.name }} not built" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${{ matrix.dockerfile }}\` does not exist yet, so **no image was published**." >> "$GITHUB_STEP_SUMMARY"
            echo "Expected until the task that creates it lands. Remove this leg or add the Dockerfile." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=${{ matrix.name }} skipped::${{ matrix.dockerfile }} missing - no image published"
          fi

      - if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      # Only when publishing. A main build needs no registry credential, and not
      # taking one is the difference between "cannot push" and "did not push".
      - if: steps.check.outputs.exists == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.check.outputs.exists == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # No type=sha. A sha tag is what made every main commit look like a
          # release; the version tag is the only thing that should name a
          # published image.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The whole policy, in one line: build always, publish only for a tag.
          # A main build still fails the job if the Dockerfile is broken, which is
          # the signal worth keeping.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
